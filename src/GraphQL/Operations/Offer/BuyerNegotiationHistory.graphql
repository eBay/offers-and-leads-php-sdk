query BuyerNegotiationHistory($input: BuyerNegotiationHistoryInput!) {
    buyerNegotiationHistory(input: $input) {
        itemNegotiations {
            negotiations {
                negotiationId
                offers {
                    offerId
                    status
                    offerCreatorRole
                    offerPrice {
                        original { currency value }
                        converted { currency value }
                    }
                    quantity
                    createdAt
                    updatedAt
                    expiresAt
                    message
                }
                latestOffer {
                    offerId
                    status
                    offerCreatorRole
                    quantity
                    offerPrice {
                        original { currency value }
                        converted { currency value }
                    }
                    createdAt
                    updatedAt
                    expiresAt
                }
            }
        }
    }
}
